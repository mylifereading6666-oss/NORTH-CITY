<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#07111d">
  <meta name="description" content="NORTH CITY - 北海道の街を歩いて探索する3Dオープンワールド試作版">
  <title>NORTH CITY</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="loading" class="overlay"><div class="loader"></div><h1>NORTH CITY</h1><p id="loading-text">札幌の街を読み込んでいます...</p></div>
  <header class="topbar"><div class="brand"><span class="brand-mark">N</span><span>NORTH <b>CITY</b></span></div><div class="location"><span class="live-dot"></span><span id="location-label">札幌市中心部</span></div></header>
  <main id="game"><div id="scene"></div>
    <section class="hud"><div class="hud-card"><small>現在地</small><strong id="coords">札幌駅周辺</strong></div><div class="hud-card weather"><small>WORLD</small><strong id="world-clock">北海道 / 札幌</strong></div><div class="hud-card"><small>VIEW DISTANCE</small><strong id="draw-distance">300 m</strong></div></section>
    <div class="hint" id="hint">左のパッドで移動 ・ 右側をドラッグして視点変更</div>
    <div class="controls"><div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="actions"><button id="run" aria-label="走る">RUN</button><button id="jump" aria-label="ジャンプ">↑</button></div></div>
    <button id="reset-camera" class="small-button">視点リセット</button>
  </main>
  <footer><span>MAP DATA: © OpenStreetMap contributors</span><span id="status">準備中</span></footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
